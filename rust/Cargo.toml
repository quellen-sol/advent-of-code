[package]
name = "advent-of-code"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.75"
clap = { version = "4.5.21", features = ["derive"] }
itertools = "0.13.0"
regex = "1.10.2"

# `aoc run` uses release builds. Keep overflow panics from debug builds so a
# wrapped integer can't turn into a silently wrong answer.
[profile.release]
overflow-checks = true
